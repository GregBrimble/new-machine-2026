name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check script syntax
        run: |
          for script in bootstrap.sh vm/run.sh vm/guest.command; do
            /bin/bash -n "$script"
          done
          /usr/bin/osacompile -o "$RUNNER_TEMP/spotlight.scpt" src/resources/spotlight.applescript
      - run: npm run check
      - run: npm test
